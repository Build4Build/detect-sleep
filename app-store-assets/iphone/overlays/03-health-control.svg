    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#abb4c5"/><stop offset="0.16" stop-color="#303746"/><stop offset="0.73" stop-color="#060810"/><stop offset="1" stop-color="#6e7685"/></linearGradient>
