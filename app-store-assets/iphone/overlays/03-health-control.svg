  <rect width="1320" height="2868" fill="url(#veil)"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#fff">
    <text x="660" y="175" font-size="100" font-weight="700" letter-spacing="-3.5">Apple Health. Your choice.</text>
    <text x="660" y="265" font-size="40" fill="#cbd7f5">Read with permission. Write only confirmed sleep.</text>
  </g>
