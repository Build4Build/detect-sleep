<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="2868" viewBox="0 0 1320 2868">
  <defs>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030617" stop-opacity="0.98"/><stop offset="0.25" stop-color="#030617" stop-opacity="0.48"/><stop offset="0.58" stop-color="#030617" stop-opacity="0"/><stop offset="1" stop-color="#02040d" stop-opacity="0.72"/></linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#abb4c5"/><stop offset="0.16" stop-color="#303746"/><stop offset="0.73" stop-color="#060810"/><stop offset="1" stop-color="#6e7685"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151129"/><stop offset="1" stop-color="#080b17"/></linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7657ff"/><stop offset="1" stop-color="#43c9ff"/></linearGradient>
