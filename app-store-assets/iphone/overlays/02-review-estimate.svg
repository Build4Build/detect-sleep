    <text x="300" y="1045" fill="#b5c0d9" font-size="27">to suggest sleep. Nothing is saved yet.</text>

    <rect x="300" y="1110" width="720" height="250" rx="34" fill="#12182c"/>
    <text x="660" y="1200" fill="#fff" font-size="48" font-weight="700" text-anchor="middle">10:48 PM – 6:31 AM</text>
    <text x="660" y="1288" fill="#cbbcff" font-size="70" font-weight="700" text-anchor="middle">7h 43m</text>
    <rect x="485" y="1320" width="350" height="5" rx="3" fill="#755eff"/>

    <rect x="300" y="1410" width="720" height="155" rx="30" fill="#152d31" stroke="#4fd8d0" stroke-opacity="0.35" stroke-width="3"/>
    <circle cx="355" cy="1488" r="24" fill="#225a57"/><path d="M342 1488l10 11 18-24" fill="none" stroke="#62e5d7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
