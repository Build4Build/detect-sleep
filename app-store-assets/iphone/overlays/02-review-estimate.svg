    <rect x="250" y="830" width="820" height="1260" rx="48" fill="#1d2239" stroke="#755eff" stroke-opacity="0.56" stroke-width="4"/>
    <circle cx="330" cy="920" r="40" fill="#342b69"/><path d="M330 886a35 35 0 1 0 30 52 29 29 0 0 1-30-52Z" fill="#b99cff"/>
    <text x="390" y="922" fill="#fff" font-size="40" font-weight="700">Probable sleep detected</text>
