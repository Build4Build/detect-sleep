    <text x="660" y="265" font-size="40" fill="#cbd7f5">Every estimate stays under your control.</text>
  </g>
  <g filter="url(#shadow)"><rect x="165" y="485" width="990" height="2260" rx="156" fill="url(#case)"/><rect x="184" y="504" width="952" height="2222" rx="139" fill="#01030a"/><rect x="210" y="530" width="900" height="2170" rx="105" fill="url(#screen)"/></g>
