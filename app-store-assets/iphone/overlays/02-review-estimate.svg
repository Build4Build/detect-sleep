      <rect x="680" y="1675" width="145" height="75" rx="22" fill="#292f49"/><text x="752" y="1724" text-anchor="middle" fill="#d9e1f5" font-weight="700">−15m</text>
      <rect x="850" y="1675" width="145" height="75" rx="22" fill="#292f49"/><text x="922" y="1724" text-anchor="middle" fill="#d9e1f5" font-weight="700">+15m</text>
      <text x="305" y="1828" fill="#b9c4df">Wake time</text>
      <rect x="680" y="1778" width="145" height="75" rx="22" fill="#292f49"/><text x="752" y="1827" text-anchor="middle" fill="#d9e1f5" font-weight="700">−15m</text>
      <rect x="850" y="1778" width="145" height="75" rx="22" fill="#292f49"/><text x="922" y="1827" text-anchor="middle" fill="#d9e1f5" font-weight="700">+15m</text>
    </g>

    <rect x="300" y="1920" width="320" height="100" rx="50" fill="#292f49"/><text x="460" y="1982" fill="#d8e0f3" font-size="31" font-weight="700" text-anchor="middle">Not sleep</text>
    <rect x="645" y="1920" width="375" height="100" rx="50" fill="url(#button)"/><text x="833" y="1982" fill="#fff" font-size="31" font-weight="700" text-anchor="middle">Confirm sleep</text>

    <rect x="280" y="2165" width="760" height="175" rx="34" fill="#151b30"/>
    <circle cx="345" cy="2253" r="28" fill="#332a62"/><path d="M345 2237v33M330 2253h30" stroke="#bb9cff" stroke-width="6" stroke-linecap="round"/>
    <text x="400" y="2238" fill="#fff" font-size="29" font-weight="700">Your decision comes first</text>
    <text x="400" y="2286" fill="#aeb9d5" font-size="25">Edit, confirm, or dismiss every estimate.</text>

    <rect x="210" y="2470" width="900" height="230" fill="#11162a"/><line x1="210" y1="2470" x2="1110" y2="2470" stroke="#303852" stroke-width="3"/>
    <g text-anchor="middle" font-size="24"><circle cx="380" cy="2550" r="20" fill="#795cff"/><text x="380" y="2600" fill="#bb9cff" font-weight="700">Today</text><rect x="640" y="2532" width="40" height="34" rx="8" fill="none" stroke="#8f9ab5" stroke-width="4"/><text x="660" y="2600" fill="#8f9ab5">History</text><path d="M920 2565v-38M950 2565v-62M980 2565v-48" stroke="#8f9ab5" stroke-width="9" stroke-linecap="round"/><text x="950" y="2600" fill="#8f9ab5">Statistics</text></g>
