    <circle cx="320" cy="1535" r="25" fill="#332a62"/><path d="M308 1535l9 10 17-23" fill="none" stroke="#bb86fc" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="365" y="1548" fill="#fff" font-size="37" font-weight="700">Daily wellness report</text>
    <g text-anchor="middle">
      <text x="390" y="1670" fill="#fff" font-size="58" font-weight="700">88%</text>
      <text x="390" y="1717" fill="#aeb9d5" font-size="24">Timing consistency</text>
      <text x="660" y="1670" fill="#fff" font-size="58" font-weight="700">91%</text>
      <text x="660" y="1717" fill="#aeb9d5" font-size="24">Continuity</text>
      <text x="930" y="1668" fill="#65d6c7" font-size="40" font-weight="700">Steady</text>
      <text x="930" y="1717" fill="#aeb9d5" font-size="24">Recovery trend</text>
