    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a4adbd"/><stop offset="0.17" stop-color="#272d3b"/><stop offset="0.76" stop-color="#060810"/><stop offset="1" stop-color="#686f7e"/></linearGradient>
