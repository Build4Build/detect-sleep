<svg xmlns="http://www.w3.org/2000/svg" width="422" height="514" viewBox="0 0 422 514">
  <defs>
    <linearGradient id="topVeil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050819" stop-opacity="0.94"/>
      <stop offset="0.24" stop-color="#050819" stop-opacity="0.45"/>
      <stop offset="0.58" stop-color="#050819" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ba4b5"/>
      <stop offset="0.18" stop-color="#252b39"/>
      <stop offset="0.74" stop-color="#070910"/>
      <stop offset="1" stop-color="#676f7d"/>
