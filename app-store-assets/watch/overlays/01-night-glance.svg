      <circle cx="111" cy="308" r="4" fill="#7661ff"/><text x="123" y="312" fill="#e9efff">Deep</text><text x="309" y="312" fill="#fff" text-anchor="end" font-weight="700">1h 18m</text>
      <circle cx="111" cy="337" r="4" fill="#54d8f5"/><text x="123" y="341" fill="#e9efff">REM</text><text x="309" y="341" fill="#fff" text-anchor="end" font-weight="700">1h 53m</text>
